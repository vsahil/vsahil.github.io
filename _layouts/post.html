<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} — Sahil Verma</title>

<!-- Math is rendered during the build with VS Code's Markdown/KaTeX plugin. -->
<link rel="stylesheet" href="/assets/katex/katex.min.css">
<link rel="stylesheet" href="https://unpkg.com/@waline/client@3.15.2/dist/waline.css">

<style>
  html { overflow-x: hidden; }
  body {
    max-width: 46rem;
    margin: 0 auto;
    padding: 2.5rem 1.25rem 6rem;
    font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: #1a1a1a;
    background: #fff;
    overflow-x: hidden;
  }
  a { color: #0645ad; }
  h1 { font-size: 1.9rem; line-height: 1.25; margin: 0 0 .3rem; }
  h2 { font-size: 1.3rem; margin: 2.6rem 0 .8rem; }
  h3 { font-size: 1.1rem; margin: 2rem 0 .6rem; }
  .meta { color: #777; font-size: .9rem; margin-bottom: 2.5rem; }
  .home { font-size: .9rem; margin-bottom: 2rem; display: block; }
  /* long display equations must scroll, not overflow, on phones */
  .katex-display { overflow-x: auto; overflow-y: hidden; padding: .3em 0; }
  pre {
    background: #f6f8fa; padding: .9rem 1rem; border-radius: 6px;
    overflow-x: auto; font-size: .87rem; line-height: 1.45;
  }
  code { font-size: .89em; }
  blockquote {
    margin: 1.6rem 0; padding: .1rem 0 .1rem 1.1rem;
    border-left: 3px solid #ddd; color: #444;
  }
  table {
    border-collapse: collapse;
    display: block;
    max-width: 100%;
    overflow-x: auto;
    margin: 1.6rem 0;
    font-size: .93rem;
  }
  th, td { border: 1px solid #ddd; padding: .45rem .7rem; text-align: left; }
  th { background: #fafafa; }
  body.wide-tables { max-width: 90rem; }
  body.wide-tables > :not(table) {
    max-width: 46rem;
    margin-left: auto;
    margin-right: auto;
  }
  body.wide-tables table {
    display: table;
    width: 100%;
    max-width: 100%;
    margin: 1.6rem 0;
    transform: none;
    table-layout: fixed;
    overflow: visible;
  }
  body.wide-tables th:nth-child(1) { width: 6%; }
  body.wide-tables th:nth-child(2) { width: 22%; }
  body.wide-tables th:nth-child(3) { width: 42%; }
  body.wide-tables th:nth-child(4) { width: 30%; }
  body.wide-tables th,
  body.wide-tables td {
    vertical-align: top;
    overflow-wrap: anywhere;
  }
  @media (max-width: 50rem) {
    body.wide-tables table {
      display: block;
      width: 100%;
      max-width: 100%;
      margin: 1.6rem 0;
      transform: none;
      table-layout: auto;
      overflow-x: auto;
    }
    body.wide-tables th:nth-child(1),
    body.wide-tables th:nth-child(2),
    body.wide-tables th:nth-child(3),
    body.wide-tables th:nth-child(4) { width: auto; }
  }
  figure { margin: 2rem 0; }
  figure svg, figure img { max-width: 100%; height: auto; }
  figcaption { color: #777; font-size: .87rem; margin-top: .5rem; }
  .discussion {
    margin-top: 4rem;
    padding-top: 1.8rem;
    border-top: 1px solid #ddd;
  }
  .discussion h2 { margin-top: 0; }
  .discussion-note {
    margin: -.25rem 0 1.4rem;
    color: #666;
    font-size: .9rem;
  }
  #waline {
    --waline-theme-color: #0645ad;
    --waline-active-color: #043b91;
    --waline-font-size: 16px;
    --waline-avatar-size: 2.5rem;
    --waline-m-avatar-size: 2rem;
  }
  .article-reactions {
    margin: 2rem 0 2.6rem;
    text-align: center;
  }
  .article-reactions-title {
    margin-bottom: .65rem;
    font-weight: 700;
  }
  .article-reactions-list {
    display: flex;
    justify-content: center;
    gap: .65rem;
  }
  .article-reaction {
    min-width: 5.25rem;
    padding: .5rem .7rem;
    border: 1px solid transparent;
    border-radius: 10px;
    background: transparent;
    color: #333;
    font: inherit;
    cursor: pointer;
  }
  .article-reaction:hover {
    border-color: #b8c9e8;
    background: #f7faff;
  }
  .article-reaction[aria-pressed="true"] {
    border-color: #8cacdf;
    background: #eef4ff;
    color: #0645ad;
  }
  .article-reaction:disabled { cursor: wait; opacity: .65; }
  .article-reaction-icon {
    position: relative;
    display: block;
    width: 2.7rem;
    height: 2.7rem;
    margin: 0 auto .15rem;
  }
  .article-reaction-icon img { width: 100%; height: 100%; }
  .article-reaction-count {
    position: absolute;
    top: -.25rem;
    right: -.35rem;
    min-width: 1.1rem;
    padding: 0 .2rem;
    border: 1px solid #0645ad;
    border-radius: 999px;
    background: #fff;
    color: #0645ad;
    font-size: .7rem;
    line-height: 1rem;
  }
  .article-reaction-label { display: block; font-size: .82rem; }
  #waline .wl-card-item { padding-left: 0; padding-right: 0; }
  #waline .wl-thread-toggle {
    margin: .2rem 0 .75rem;
    padding: .3rem .65rem;
    border: 1px solid #d4d4d4;
    border-radius: 999px;
    color: #555;
    background: #fff;
    font: inherit;
    font-size: .78rem;
    cursor: pointer;
  }
  #waline .wl-thread-toggle:hover {
    border-color: #0645ad;
    color: #0645ad;
  }
  #waline .wl-thread-collapsed { display: none; }
</style>
</head>

<body class="{{ page.body_class }}">
  <a class="home" href="/">← Sahil Verma</a>

  <h1>{{ page.title }}</h1>
  <div class="meta">
    {{ page.date | date: "%B %-d, %Y" }}
    {% if page.subtitle %} · {{ page.subtitle }}{% endif %}
  </div>

  {{ content }}

  <section class="discussion" aria-labelledby="discussion-title">
    <h2 id="discussion-title">Discussion</h2>
    <p class="discussion-note">Name is optional. Sign in to edit or delete your own comments.</p>
    <div class="article-reactions" aria-labelledby="article-reactions-title">
      <div id="article-reactions-title" class="article-reactions-title">What did you think?</div>
      <div class="article-reactions-list">
        <button class="article-reaction" type="button" data-reaction="0" aria-pressed="false">
          <span class="article-reaction-icon">
            <img src="/assets/reactions/thumbs-up.svg" alt="">
            <span class="article-reaction-count">0</span>
          </span>
          <span class="article-reaction-label">Helpful</span>
        </button>
        <button class="article-reaction" type="button" data-reaction="1" aria-pressed="false">
          <span class="article-reaction-icon">
            <img src="/assets/reactions/heart.svg" alt="">
            <span class="article-reaction-count">0</span>
          </span>
          <span class="article-reaction-label">Loved it</span>
        </button>
      </div>
    </div>
    <div id="waline"></div>
  </section>

  <script type="module">
    import { init } from 'https://unpkg.com/@waline/client@3.15.2/dist/waline.js';

    const serverURL = 'https://vsahil-blog-comments.vercel.app';
    const articlePath = window.location.pathname.replace(/\/$/, '');
    const walineRoot = document.querySelector('#waline');
    const reactionButtons = [...document.querySelectorAll('.article-reaction')];
    const reactionStorageKey = 'SAHIL_BLOG_REACTIONS';

    function readReactionStore() {
      try {
        const value = JSON.parse(localStorage.getItem(reactionStorageKey) ?? '{}');
        return value && typeof value === 'object' ? value : {};
      } catch {
        return {};
      }
    }

    const reactionStore = readReactionStore();
    const selectedReactions = new Set(
      Array.isArray(reactionStore[articlePath]) ? reactionStore[articlePath] : []
    );

    function renderReactionSelection() {
      for (const button of reactionButtons) {
        const index = Number(button.dataset.reaction);
        button.setAttribute('aria-pressed', String(selectedReactions.has(index)));
      }
    }

    function saveReactionSelection() {
      reactionStore[articlePath] = [...selectedReactions].sort();
      localStorage.setItem(reactionStorageKey, JSON.stringify(reactionStore));
    }

    async function loadReactionCounts() {
      try {
        const response = await fetch(
          `${serverURL}/api/article?path=${encodeURIComponent(articlePath)}` +
          '&type=reaction0%2Creaction1&lang=en'
        );
        const payload = await response.json();
        if (payload.errno) throw new Error(payload.errmsg || 'Unable to load reactions');

        const counts = payload.data?.[0] ?? {};
        for (const button of reactionButtons) {
          const index = Number(button.dataset.reaction);
          button.querySelector('.article-reaction-count').textContent =
            String(counts[`reaction${index}`] ?? 0);
        }
      } catch (error) {
        console.error(error);
      }
    }

    let reactionBusy = false;
    for (const button of reactionButtons) {
      button.addEventListener('click', async () => {
        if (reactionBusy) return;

        reactionBusy = true;
        for (const item of reactionButtons) item.disabled = true;

        const index = Number(button.dataset.reaction);
        const wasSelected = selectedReactions.has(index);

        try {
          const response = await fetch(`${serverURL}/api/article?lang=en`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              path: articlePath,
              type: `reaction${index}`,
              action: wasSelected ? 'desc' : 'inc'
            })
          });
          const payload = await response.json();
          if (payload.errno) throw new Error(payload.errmsg || 'Unable to update reaction');

          if (wasSelected) selectedReactions.delete(index);
          else selectedReactions.add(index);

          const count = payload.data?.[0]?.[`reaction${index}`];
          if (typeof count === 'number') {
            button.querySelector('.article-reaction-count').textContent = String(count);
          }
          saveReactionSelection();
          renderReactionSelection();
        } catch (error) {
          console.error(error);
        } finally {
          reactionBusy = false;
          for (const item of reactionButtons) item.disabled = false;
        }
      });
    }

    renderReactionSelection();
    loadReactionCounts();

    init({
      el: walineRoot,
      serverURL,
      path: articlePath,
      lang: 'en',
      meta: ['nick'],
      requiredMeta: [],
      login: 'enable',
      commentSorting: 'latest',
      pageSize: 10,
      imageUploader: false,
      search: false,
      noRss: true,
      locale: {
        nick: 'Name (optional)',
        placeholder: 'Join the discussion…'
      }
    });

    function foldReplyThreads() {
      for (const thread of walineRoot.querySelectorAll('.wl-cards > .wl-card-item .wl-quote')) {
        if (thread.dataset.foldReady === 'true') continue;

        const replyCount = thread.querySelectorAll('.wl-card-item').length;
        if (!replyCount) continue;

        thread.dataset.foldReady = 'true';
        thread.classList.add('wl-thread-collapsed');

        const toggle = document.createElement('button');
        toggle.type = 'button';
        toggle.className = 'wl-thread-toggle';
        toggle.setAttribute('aria-expanded', 'false');

        const setLabel = (expanded) => {
          toggle.textContent = expanded
            ? 'Hide replies'
            : `View ${replyCount} ${replyCount === 1 ? 'reply' : 'replies'}`;
        };

        setLabel(false);
        toggle.addEventListener('click', () => {
          const expanded = toggle.getAttribute('aria-expanded') === 'true';
          toggle.setAttribute('aria-expanded', String(!expanded));
          thread.classList.toggle('wl-thread-collapsed', expanded);
          setLabel(!expanded);
        });

        thread.before(toggle);
      }
    }

    new MutationObserver(foldReplyThreads).observe(walineRoot, {
      childList: true,
      subtree: true
    });
    foldReplyThreads();
  </script>
</body>
</html>
