ionship": "Connect designed protein sequences with experiments that measure the functional effects of sequence changes."}, {"id": "P10", "relationship": "Connect experimental mutation-effect measurements with predictions of missense variant effects."}, {"id": "P28", "relationship": "Connect measuring sequence–function landscapes with using those measurements to improve proteins."}], "summary_html": "", "summary_text": "", "source_file": "papers/P27-deep-mutational-scanning.md"}, {"id": "P28", "slug": "ml-directed-evolution", "label": "ML-assisted directed evolution", "title": "Machine learning-assisted directed protein evolution with combinatorial libraries", "year": 2019, "publication_type": "Journal article", "group": "design", "subcategory": null, "url": "https://doi.org/10.1073/pnas.1901979116", "tags": ["directed-evolution", "sequence-function", "enzyme-engineering", "experimental-validation"], "related": [{"id": "P27", "relationship": "Connect measuring sequence–function landscapes with using those measurements to improve proteins."}, {"id": "P07", "relationship": "Compare generative protein design with iterative optimization guided by measured function."}, {"id": "P34", "relationship": "Compare choosing protein variants to test with choosing nutrient conditions in an experimental learning loop."}], "summary_html": "", "summary_text": "", "source_file": "papers/P28-ml-directed-evolution.md"}, {"id": "P29", "slug": "netmhcpan", "label": "NetMHCpan-4.1 / NetMHCIIpan-4.0", "title": "NetMHCpan-4.1 and NetMHCIIpan-4.0: improved predictions of MHC antigen presentation by concurrent motif deconvolution and integration of MS MHC eluted ligand data", "year": 2020, "publication_type": "Journal article", "group": "immunity", "subcategory": null, "url": "https://doi.org/10.1093/nar/gkaa379", "tags": ["antigen-presentation", "peptide-MHC", "binding-affinity", "immunopeptidomics"], "related": [{"id": "P03", "relationship": "Compare predicting peptide–MHC binding and presentation with predicting biomolecular complex structures."}, {"id": "P30", "relationship": "Distinguish presentation of a peptide by MHC from recognition of that target by a T-cell receptor."}], "summary_html": "", "summary_text": "", "source_file": "papers/P29-netmhcpan.md"}, {"id": "P30", "slug": "tapir", "label": "TAPIR", "title": "TAPIR: a T-cell receptor language model for predicting rare and novel targets (LP)", "year": 2023, "publication_type": "Preprint · v1", "group": "immunity", "subcategory": null, "url": "https://www.biorxiv.org/content/10.1101/2023.09.12.557285v1", "tags": ["T-cell-receptor", "antigen-recognition", "sequence-modeling", "experimental-validation"], "related": [{"id": "P29", "relationship": "Distinguish presentation of a peptide by MHC from recognition of that target by a T-cell receptor."}, {"id": "P07", "relationship": "Compare sequence-based receptor–target prediction with designing biomolecular interactions."}], "summary_html": "", "summary_text": "", "source_file": "papers/P30-tapir.md"}, {"id": "P08", "slug": "enformer", "label": "Enformer", "title": "Effective gene expression prediction from sequence by integrating long-range interactions", "year": 2021, "publication_type": "Journal article", "group": "genetics", "subcategory": null, "url": "https://www.nature.com/articles/s41592-021-01252-x", "tags": ["gene-regulation", "sequence-to-function", "long-range-interactions", "transformers"], "related": [{"id": "P09", "relationship": "Different sequence-to-function targets: gene regulation and RNA splicing."}, {"id": "P11", "relationship": "Compare supervised regulatory prediction with genomic language modeling."}, {"id": "P12", "relationship": "Follow the development of models predicting regulatory measurements from DNA."}, {"id": "P33", "relationship": "Connect sequence-based regulatory prediction with experimental investigation of a regulatory disease variant."}], "summary_html": "\u003cp\u003e1. What is gene expression, and why does controlling it matter?\u003c/p\u003e\n\u003cp\u003eGene expression is the process of using the information in a gene to make a functional product. The usual way this works is by converting the DNA into RNA (called transcription, using a RNA polymerase) and then a ribosome converting that RNA into a protein (called translation). A gene that is said to have expressed usually means that a lot of it is converted to RNA and the corresponding proteins. However, this has caveats as some genes can produce functional RNAs that are never translated into proteins. Also usually when people say a gene is highly expressed, they are talking about high RNA corresponding to this DNA, but another RNA which is quickly converted to protein might be harder to measure. Controlling gene-expression matters for the proper functioning of biology, for e.g. pancreatic cells should express the insulin gene while other cells should not. \u003c/p\u003e\n\u003cp\u003e2. How can cells with essentially the same DNA behave differently?\u003c/p\u003e\n\u003cp\u003eGene expression in a cell is controlled by several factors like (a) transcription factors which are specific proteins that bind to particular DNA sequences and help increase or decrease the expression of nearby (sometimes distant) genes, (b) DNA is packaged with chromatin in a cell\u0026#x27;s nucleus and this packiing is organized differently across cell types allows access to different parts of the DNA for the transcription process (not all accessible regions are transcribed tho), and (c) cellular context like hormones, nutrients, infection, developmental signals can change which gene and how much it expresses. \u003c/p\u003e\n\u003cp\u003e3. How does DNA regulate gene expression?\u003c/p\u003e\n\u003cp\u003eThere are several factors that assist gene expression:\u003c/p\u003e\n\u003cp\u003ea. Transcription Start Site (TSS): It is the first nucleotide where RNA transcription begins (note that this is different from the protein translation begins as mRNA has a stretch of RNA before its protein-coding instructions). A gene can use different TSSs under different circumstances. \u003c/p\u003e\n\u003cp\u003eb. Promoter: Its a DNA region around a TSS that helps assemble the machinery needed for translation (RNA polymerase works with other proteins to start making RNA).\u003c/p\u003e\n\u003cp\u003ec. Transcription factors are proteins that regulate transcription -- they recognize short DNA sequence patterns (called binding motifs) which can stabilize or inhibit the transcription machinery. \u003c/p\u003e\n\u003cp\u003ec. Enhancer is a DNA region that can increase transcription from a target promoter under appropriate context. Enhancers often contain binding sites for several transcription factors, that when binded can help a target promoter initiate transcription more frequently. \u003c/p\u003e\n\u003cp\u003eNon-coding parts of a DNA might not directly produce an RNA, but can still impact the trancription process (like a promoter and enhancer).  \u003c/p\u003e\n\u003cp\u003eWhen a DNA mutation happens, that can change the protein-coding region (and therefore change the protein produced) or change the regulatory region (which change how much the RNA is produced) or no change if its unrelated to this gene. \u003c/p\u003e\n\u003cp\u003e4. Why do distant parts of the DNA matter? How can an enhancer influence a gene thousands of DNA bases away?\u003c/p\u003e\n\u003cp\u003eDistant parts of a DNA in the sequence position might become very close in the 3D space because of how the chromatin folds the DNA, in this case an enchancer 50 kb away from a promoter can come close and increase RNA production of a gene (called as promoter-enhancer looping). Note that this looping is not rigid, chromatin is dynamic and physical proximity does not always impact RNA production. So for gene regulation modeling, a model should not only consider the immediate neighbor sequence positions, but farther positions as well. \u003c/p\u003e\n\u003cp\u003e5. What biological problem is Enformer trying to solve, and why is it useful?\u003c/p\u003e\n\u003cp\u003eEnformer aims to can predict gene activity in different cell types from the surrounding DNA. The central thesis is to have a long-context view of gene regulation, rather than only looking at a gene\u0026#x27;s nearby promoter. There are two other kinds of predictions they want to make: (b) predicting impact of mutations, so say if there is a change in enhancer of a gene, we want to be able to predict the impact on gene expression (sau that change weakens the enhancer\u0026#x27;s binding site), and (c) identity the parts of the surrounding DNA that impact gene\u0026#x27;s expression (this can help researchers rank and prioritize enhancer-gene relationships for experimental verification). A disease connection comes useful via use case (b) and (c) when a change in the noncoding part of the DNA impacts gene expression and thereby affect biology. \u003c/p\u003e\n\u003cp\u003e6. What exactly are the model’s inputs and outputs? What is a “genomic track”? How are predictions organized along the DNA, and how does the model distinguish cell types when its input is only sequence?\u003c/p\u003e\n\u003cp\u003eThe model inputs are DNA sequences that are capped at 196K length, each DNA nucleotide is one of 4 (A, T, G, C), so the input is a one-hot vector of size 196K * 4. The target (or the output) is derived from the experimental data. Say there are bunch of experiments done in labs across the world measuring various activities in some cell types that can be tied to different parts of the human genome. Such a measurement is called a genomic track. Now for a particular input, the model\u0026#x27;s goal will be to output the same experimentally observed measurements of those properties. However, the loss is only calculated for the central 114K input base pairs of the DNA from the 196K pairs, from each side 40K pairs are excluded from the loss as the model might not have enough context about them (even though they might still influence the central bit\u0026#x27;s prediction). Also the central 114K base pairs are binned into 128 sized base pairs bins giving 896 bins and these measurements are a target for that bin, here is an example of what that might look like \u003c/p\u003e\n\u003cp\u003e| Genomic bin | A: CAGE, liver | B: CAGE, neurons | C: accessibility, liver | D: TF binding | E: histone mark | … | |---|---:|---:|---:|---:|---:|---| | Bin 1 | 0 | 0 | 1.2 | 0.4 | 3.1 | … | | Bin 2 | 45 | 2 | 8.6 | 0.2 | 7.5 | … | | Bin 3 | 8 | 31 | 3.4 | 6.1 | 2.8 | … | | … | … | … | … | … | … | … | | Bin 896 | 0 | 4 | 0.5 | 1.7 | 0.9 | … |\u003c/p\u003e\n\u003cp\u003eHere the columns are the different experiments that were done at various labs and the dataset was collected (over 5313 tracks) and the values are non-negative numerical targets. Overall there were 638 CAGE experiments, 684 DNA accessibility experiments, 2131 transcription-factor ChIP-seq, and 1860 histone modification chIP-seq. Now for these experiments, we might not have a signal for each bin (or even the entire 196K long input) as the experimenters might have focused on a different region or sometimes regions cannot be mapped accurately. \u003c/p\u003e\n\u003cp\u003eThe last question about distinguishability of a cell from the DNA sequences comes from the combination of patterns learned in the data. So there might be specific patterns of DNA that a transcription protein gets attached and increase RNA production for it. Such patterns can be learned by the model that can then predict like \u0026quot;regions containing this combination of DNA patterns leads to high CAGE signal in liver cells, but low in neuron cells\u0026quot; for example. \u003c/p\u003e\n\u003cp\u003e7. Where do the training data come from, and what do the experiments actually measure? What do CAGE, DNA-accessibility assays, and ChIP–seq tell us?\u003c/p\u003e\n\u003cp\u003eThe training data for Enformer comes from the public datasets that were assembled for a previous paper, Basenji2. Lets understand in more depth each of these measurements:\u003c/p\u003e\n\u003cp\u003ea. CAGE: stands for cap analysis of Gene expression, it captures and sequences the beginning of RNA molecules carrying a particular chemical \u0026quot;cap\u0026quot;. An RNA has a beginnning called 5\u0026#x27;-end and the goal of CAGE is to identify how many RNA sequences start in a region, more RNA starting means strong CAGE signal or otherwise low CAGE signal. \u003c/p\u003e\n\u003cp\u003eb. DNAse-seq /ATAC-seq: DNA in a cell is packaged with chromatin, and therefore some regions are easier to access than other. This measures the accessibility of a region which can be a promoter, enhancer for e.g. High signal means accessible DNA\u003c/p\u003e\n\u003cp\u003ec. Transcription-factor ChIP-seq: this measures which parts of a DNA are associated with a particular transcription factor (protein). \u003c/p\u003e\n\u003cp\u003ed. Histone-modification ChIP-seq: DNA wraps around proteins called histones and cells can attach specific groups to histones: which are modifications associated with different regulatory states. This experiment (similar to TF ChIP-seq) find regions of the DNA that are associated with a specific histone marker. \u003c/p\u003e\n\u003cp\u003e8. What does one training example represent, and what is the learning objective? How are DNA regions paired with thousands of experimental tracks? \u003c/p\u003e\n\u003cp\u003eOne training example is a pair of $(X, Y)$, where $X \\in \\{0, 1\\}^{196\\mathrm{K} \\times 4}$ and $Y \\in \\mathbb{R}^{896 \\times 5313}$. Therefore there are 4.76M scalar targets per human example (although these are not IID because neighboring bins are related tracks are correlated). The model compues $\\hat{y} = f(X)$ and the loss penalizes differences with the experimental assay. The loss is Poisson negative log-likelihood, $l(y, hat{y}) = hat{y} - y\\log \\hat(y)$ (the loss is averaged over each bin and each track) and a softplus (similar to relu) ensures positive predictions. Poisson is chosen because many biological measurements start as a count and Poisson is better at modeling counts than L2 and Poisson weighs errors differently than L2 (L2 has the same value irrespective of the value of y, so an error of 10 at value 100 and 10000 have the same L2 error, whereas Poisson takes into account that an error of 10 is worse when y=10 than when y=10000). \u003c/p\u003e\n\u003cp\u003eEnformer also separately trains in mouse examples using 1643 tracks but it shares the model\u0026#x27;s body. Human and mouse batches alternate during training, with a final finetuning on human data. \u003c/p\u003e\n\u003cp\u003e9. What is the central computational contribution, and how does the architecture implement it?\u003c/p\u003e\n\u003cp\u003eEnformer combined comvolutions (that learn local DNA patterns) with attention (combines information across distant genomic regions). Here are the stages:\u003c/p\u003e\n\u003cp\u003e| Stage | Output shape, excluding batch | |---|---| | One-hot DNA input | 196608 \u003cem\u003e 4 (in next stage 128 bp combine to give 1536 bins) | | Convolutions and pooling | 1536 \u003c/em\u003e 1536 (one is the number of genomic positions and other is the feature size) | | 11 transformer blocks | 1536 \u003cem\u003e 1536 | | Crop 320 positions from each side | 896 \u003c/em\u003e 1536 | | Per-position feature transformation | 896 \u003cem\u003e 3072 | | Human output head and softplus | 896 \u003c/em\u003e 5313 |\u003c/p\u003e\n\u003cp\u003ea. Convolutions can learn filters specific to certain motifs and then apply it across the entire input, and therefore is a good inductive bias. Successive layers combine features and after 7 rounds of pooling we get, $196608/2^{7} = 1536$. Each vector incorporates information from neighboring sequences, so its not the information from exactly those 128 base pairs. \u003c/p\u003e\n\u003cp\u003eb. Attention just as in LLMs helps distant regions to attend to each other and relative position embeddings help the attention account for how far they are in the sequence (note that position embeddings account for the distance along the DNA sequence, not the 3D distance). \u003c/p\u003e\n\u003cp\u003ec. Once attention has mixed information from all the regions, the 320 bins from each side are cropped as those regions might require even more regions for accurate prediction, but they can still influence the predictions of the central region. Finally, the contextual representation is projected to the tracks (humans or mouse). \u003c/p\u003e\n\u003cp\u003e10. How are training and evaluation separated?\u003c/p\u003e\n\u003cp\u003eThe training and evaluation are done on distinct genomic regions but for the same genomic tracks used during training, so the expected generalization is to new regions rather than new tracks. The split of regions cannot be just random because nearby regions can share similarities in measurements and this can even be true for human genomic regions and mouse genomic regions because of shared ancestry. Therefore the data split is coordinated between humans and mouse: entire genome is divided into regions with 1M bp and a human and mouse region is said to be related if they share more than 100K bp of alignment. Now an entire 1M region is assigned to either training, val, or test. Final split are of 196K base pair windows are: \u003c/p\u003e\n\u003cp\u003e| Species | Training | Validation | Test | |---|---:|---:|---:| | Human | 34,021 | 2,213 | 1,937 | | Mouse | 29,295 | 2,209 | 2,017 |\u003c/p\u003e\n\u003cp\u003e11. How is gene-expression prediction evaluated, and what does the improvement mean?\u003c/p\u003e\n\u003cp\u003eThe first step is to convert the bin-level signal to gene-level expression estimates. This is done by summing up the signal in each bin containing all the TSS (transcription start sites) for genes that are known to researchers. This gives us 638 CAGE track value for each gene. Now image a table like this:\u003c/p\u003e\n\u003cp\u003e| | Liver CAGE | Neuron CAGE |  |---|---:|---:| | Gene A | … | … | | Gene B | … | … | | Gene C | … | … |\u003c/p\u003e\n\u003cp\u003eThere are two axes of evaluation: for a specific track, does the model capture the correlations between different gene expressions (down the column) and for a specific gene, does the model capture the correlations between different biological contexts, and these are distinct measurements for understanding the model capability. They compute the average pearson correlation across the CAGE tracks and found that compared to the baseline Basenji2 model (0.81), Enformer captured more correlations (0.85). Based on some repeated tracks, authors estimate the upper limit of this correlation to be 0.94 (as the same tracks give different measurements under repeated experiments). \u003c/p\u003e\n\u003cp\u003e12. Which design choices actually explain the improvement?\u003c/p\u003e\n\u003cp\u003eAuthors perform several ablations experiments to test this part: a. Replace attention with dilated convolutions: attention performs better b. receptive field: they use attention but restrict its receptive field to 44K bp -- the model performs worse, so the model might be using distant parts of the DNA for this task.  c. Increasing model hidden dimension also helped (so larger model helped) d. Positional embeddings also help performance and their custom relation embeddings perform better than standard embeddings like sine and cosine, meaning relative distance is a better informant to the model. \u003c/p\u003e\n\u003cp\u003e13. What evidence suggests that Enformer uses biologically relevant regulatory elements?\u003c/p\u003e\n\u003cp\u003eHere the authors perform an experiment to show that Enformer\u0026#x27;s prediction are correlated with experimental evidence of an enhancer\u0026#x27;s impact on gene expression. For this, the take a lab experiment where a candidate enhancer K562 in a human cell line was suppressed and that lead to statistically significant gene expression change. And now they perform a experiment where they randomly replace the a candidate region with a random DNA sequence and study its impact on the K562 CAGE signal (this is called as in-silico mutagenesis). The score is $S(E, G) = |\\hat{y}(original DNA) - \\hat{y}(DNA with region X randomized) | $. They evaluate candidate regsionw with 2-kb windows around this gene\u0026#x27;s TSS. They use the predicted score to rank enhancer-gene pairs and evaluate how well the ranking recovers the experimentally validated pairs (they use precision-recall curve for this). Authors find Enformer\u0026#x27;s scores to outperform the baseline Basenji\u0026#x27;s score (which only evaluated much larger candidates at 20K bp). This experiment alludes to Enformer\u0026#x27;s prediction depending on biologically relevant regulatory elements. \u003c/p\u003e\n\u003cp\u003e14. Can Enformer predict what happens when the DNA sequence changes?\u003c/p\u003e\n\u003cp\u003eAuthors test this using naturally occuring genetic variations in humans and controlled lab experiments that target specific DNA changes. The difference in the prediction scores before and after the change is computed, a positive difference means increased expression and vice-versa.  For the first case, they use expression quantitative trait locus (or eQTL) whcih is a genomic location where genetic variation is statitically linked with variation in gene expression, for e.g. \u0026quot;Across people, those carrying allele G tend to have higher expression of gene Z in liver than those carrying allele A.\u0026quot; For this the authors use the GTEx project.  For the second, they use lab experiments that directly mutate DNA and measure its effect using massively parallel reporter assays (MPRAs).  For both cases, Enformer performs better than Basenji2. However, both models struggle with predictions when variants are more than 1kb from the TSS, limiting confidence in predicting impact of distant regulatory mutations. \u003c/p\u003e\n\u003cp\u003e15. What has the paper established, and what remains unsolved?\u003c/p\u003e\n\u003cp\u003eThe paper shows that use long-range DNA information improves predictions of measured gene regulation and even show usage of biologically relevant regulatory factors. There are several limitations of the approach: a. the model is only given DNA sequence as input and therefore it cannot base its predictions on cellular contexts like transcription-factor concentration, signaling state, or chromatin state. \u003c/p\u003e\n\u003cp\u003eb. The differences in predictions do not establish causal impact. \u003c/p\u003e\n\u003cp\u003eMainly the paper allows better prioritization: plausible enhancers and variants to test. \u003c/p\u003e\n\u003ch2\u003eMy questions:\u003c/h2\u003e\n\u003cp\u003e1. Since the neighboring bins and tracks are related, how can we use a loss that models that part too?\u003c/p\u003e\n\u003cp\u003e2. What if we replace convolutions with attention like used in deepseek for long-context modeling?\u003c/p\u003e", "summary_text": "1. What is gene expression, and why does controlling it matter?\n\nGene expression is the process of using the information in a gene to make a functional product. The usual way this works is by converting the DNA into RNA (called transcription, using a RNA polymerase) and then a ribosome converting that RNA into a protein (called translation). A gene that is said to have expressed usually means that a lot of it is converted to RNA and the corresponding proteins. However, this has caveats as some genes can produce functional RNAs that are never translated into proteins. Also usually when people say a gene is highly expressed, they are talking about high RNA corresponding to this DNA, but another RNA which is quickly converted to protein might be harder to measure. Controlling gene-expression matters for the proper functioning of biology, for e.g. pancreatic cells should express the insulin gene while other cells should not. \n\n2. How can cells with essentially the same DNA behave differently?\n\nGene expression in a cell is controlled by several factors like (a) transcription factors which are specific proteins that bind to particular DNA sequences and help increase or decrease the expression of nearby (sometimes distant) genes, (b) DNA is packaged with chromatin in a cell's nucleus and this packiing is organized differently across cell types allows access to different parts of the DNA for the transcription process (not all accessible regions are transcribed tho), and (c) cellular context like hormones, nutrients, infection, developmental signals can change which gene and how much it expresses. \n\n3. How does DNA regulate gene expression?\n\nThere are several factors that assist gene expression:\n\na. Transcription Start Site (TSS): It is the first nucleotide where RNA transcription begins (note that this is different from the protein translation begins as mRNA has a stretch of RNA before its protein-coding instructions). A gene can use different TSSs under different circumstances. \n\nb. Promoter: Its a DNA region around a TSS that helps assemble the machinery needed for translation (RNA polymerase works with other proteins to start making RNA).\n\nc. Transcription factors are proteins that regulate transcription -- they recognize short DNA sequence patterns (called binding motifs) which can stabilize or inhibit the transcription machinery. \n\nc. Enhancer is a DNA region that can increase transcription from a target promoter under appropriate context. Enhancers often contain binding sites for several transcription factors, that when binded can help a target promoter initiate transcription more frequently. \n\nNon-coding parts of a DNA might not directly produce an RNA, but can still impact the trancription process (like a promoter and enhancer).  \n\nWhen a DNA mutatio nputs are DNA sequences that are capped at 196K length, each DNA nucleotide is one of 4 (A, T, G, C), so the input is a one-hot vector of size 196K * 4. The target (or the output) is derived from the experimental data. Say there are bunch of experiments done in labs across the world measuring various activities in some cell types that can be tied to different parts of the human genome. Such a measurement is called a genomic track. Now for a particular input, the model's goal will be to output the same experimentally observed measurements of those properties. However, the loss is only calculated for the central 114K input base pairs of the DNA from the 196K pairs, from each side 40K pairs are excluded from the loss as the model might not have enough context about them (even though they might still influence the central bit's prediction). Also the central 114K base pairs are binned into 128 sized base pairs bins giving 896 bins and these measurements are a target for that bin, here is an example of what that might look like \n\n| Genomic bin | A: CAGE, liver | B: CAGE, neurons | C: accessibility, liver | D: TF binding | E: histone mark | … |\n|---|---:|---:|---:|---:|---:|---|\n| Bin 1 | 0 | 0 | 1.2 | 0.4 | 3.1 | … |\n| Bin 2 | 45 | 2 | 8.6 | 0.2 | 7.5 | … |\n| Bin 3 | 8 | 31 | 3.4 | 6.1 | 2.8 | … |\n| … | … | … | … | … | … | … |\n| Bin 896 | 0 | 4 | 0.5 | 1.7 | 0.9 | … |\n\nHere the columns are the different experiments that were done at various labs and the dataset was collected (over 5313 tracks) and the values are non-negative numerical targets. Overall there were 638 CAGE experiments, 684 DNA accessibility experiments, 2131 transcription-factor ChIP-seq, and 1860 histone modification chIP-seq. Now for these experiments, we might not have a signal for each bin (or even the entire 196K long input) as the experimenters might have focused on a different region or sometimes regions cannot be mapped accurately. \n\nThe last question about distinguishability of a cell from the DNA sequences comes from the combination of patterns learned in the data. So there might be specific patterns of DNA that a transcription protein gets attached and increase RNA production for it. Such patterns can be learned by the model that can then predict like \"regions containing this combination of DNA patterns leads to high CAGE signal in liver cells, but low in neuron cells\" for example. \n\n7. Where do the training data come from, and what do the experiments actually measure? What do CAGE, DNA-accessibility assays, and ChIP–seq tell us?\n\nThe training data for Enformer comes from the public datasets that were assembled for a previous paper, Basenji2. Lets understand in more depth each of these measurements:\n\na. CAGE: stands for cap analysis of Gene expression, it captures and sequences the beginning of RNA molecules carrying a particular chemical \"cap\". An RNA has a beginnning called 5'-end and the goal of CAGE is to identify how many RNA sequences start in a region, more RNA starting means strong CAGE signal or otherwise low CAGE signal. \n\nb. DNAse-seq /ATAC-seq: DNA in a cell is packaged with chromatin, and therefore some regions are easier to access than other. This measures the accessibility of a region which can be a promoter, enhancer for e.g. High signal means accessible DNA\n\nc. Transcription-factor ChIP-seq: this measures which parts of a DNA are associated with a particular transcription factor (protein). \n\nd. Histone-modification ChIP-seq: DNA wraps around proteins called histones and cells can attach specific groups to histones: which are modifications associated with different regulatory states. This experiment (similar to TF ChIP-seq) find regions of the DNA that are associated with a specific histone marker. \n\n8. What does one training example represent, and what is the learning objective? How are DNA regions paired with thousands of experimental tracks? \n\nOne training example is a pair of $(X, Y)$, where $X \\in \\{0, 1\\}^{196\\mathrm{K} \\times 4}$ and $Y \\in \\mathbb{R}^{896 \\times 5313}$. Therefore there are 4.76M scalar targets per human example (although these are not IID because neighboring bins are related tracks are correlated). The model compues $\\hat{y} = f(X)$ and the loss penalizes differences with the experimental assay. The loss is Poisson negative log-likelihood, $l(y, hat{y}) = hat{y} - y\\log \\hat(y)$ (the loss is averaged over each bin and each track) and a softplus (similar to relu) ensures positive predictions. Poisson is chosen because many biological measurements start as a count and Poisson is better at modeling counts than L2 and Poisson weighs errors differently than L2 (L2 has the same value irrespective of the value of y, so an error of 10 at value 100 and 10000 have the same L2 error, whereas Poisson takes into account that an error of 10 is worse when y=10 than when y=10000). \n\nEnformer also separately trains in mouse examples using 1643 tracks but it shares the model's body. Human and mouse batches alternate during training, with a final finetuning on human data. \n\n9. What is the central computational contribution, and how does the architecture implement it?\n\nEnformer combined comvolutions (that learn local DNA patterns) with attention (combines information across distant genomic regions). Here are the stages:\n\n| Stage | Output shape, excluding batch |\n|---|---|\n| One-hot DNA input | 196608 * 4 (in next stage 128 bp combine to give 1536 bins) |\n| Convolutions and pooling | 1536 * 1536 (one is the number of genomic positions and other is the feature size) |\n| 11 transformer blocks | 1536 * 1536 |\n| Crop 320 positions from each side | 896 * 1536 |\n| Per-position feature transformation | 896 * 3072 |\n| Human output head and softplus | 896 * 5313 |\n\na. Convolutions can learn filters specific to certain motifs and then apply it across the entire input, and therefore is a good inductive bias. Successive layers combine features and after 7 rounds of pooling we get, $196608/2^{7} = 1536$. Each vector incorporates information from neighboring sequences, so its not the information from exactly those 128 base pairs. \n\nb. Attention just as in LLMs helps distant regions to attend to each other and relative position embeddings help the attention account for how far they are in the sequence (note that position embeddings account for the distance along the DNA sequence, not the 3D distance). \n\nc. Once attention has mixed information from all the regions, the 320 bins from each side are cropped as those regions might require even more regions for accurate prediction, but they can still influence the predictions of the central region. Finally, the contextual representation is projected to the tracks (humans or mouse). \n\n10. How are training and evaluation separated?\n\nThe training and evaluation are done on distinct genomic regions but for the same genomic tracks used during training, so the expected generalization is to new regions rather than new tracks. The split of regions cannot be just random because nearby regions can share similarities in measurements and this can even be true for human genomic regions and mouse genomic regions because of shared ancestry. Therefore the data split is coordinated between humans and mouse: entire genome is divided into regions with 1M bp and a human and mouse region is said to be related if they share more than 100K bp of alignment. Now an entire 1M region is assigned to either training, val, or test. Final split are of 196K base pair windows are: \n\n| Species | Training | Validation | Test |\n|---|---:|---:|---:|\n| Human | 34,021 | 2,213 | 1,937 |\n| Mouse | 29,295 | 2,209 | 2,017 |\n\n11. How is gene-expression prediction evaluated, and what does the improvement mean?\n\nThe first step is to convert the bin-level signal to gene-level expression estimates. This is done by summing up the signal in each bin containing all the TSS (transcription start sites) for genes that are known to researchers. This gives us 638 CAGE track value for each gene. Now image a table like this:\n\n| | Liver CAGE | Neuron CAGE | \n|---|---:|---:|\n| Gene A | … | … |\n| Gene B | … | … |\n| Gene C | … | … |\n\nThere are two axes of evaluation: for a specific track, does the model capture the correlations between different gene expressions (down the column) and for a specific gene, does the model capture the correlations between different biological contexts, and these are distinct measurements for understanding the model capability. They compute the average pearson correlation across the CAGE tracks and found that compared to the baseline Basenji2 model (0.81), Enformer captured more correlations (0.85). Based on some repeated tracks, authors estimate the upper limit of this correlation to be 0.94 (as the same tracks give different measurements under repeated experiments). \n\n12. Which design choices actually explain the improvement?\n\nAuthors perform several ablations experiments to test this part:\na. Replace attention with dilated convolutions: attention performs better\nb. receptive field: they use attention but restrict its receptive field to 44K bp -- the model performs worse, so the model might be using distant parts of the DNA for this task. \nc. Increasing model hidden dimension also helped (so larger model helped)\nd. Positional embeddings also help performance and their custom relation embeddings perform better than standard embeddings like sine and cosine, meaning relative distance is a better informant to the model. \n\n13. What evidence suggests that Enformer uses biologically relevant regulatory elements?\n\nHere the authors perform an experiment to show that Enformer's prediction are correlated with experimental evidence of an enhancer's impact on gene expression. For this, the take a lab experiment where a candidate enhancer K562 in a human cell line was suppressed and that lead to statistically significant gene expression change. And now they perform a experiment where they randomly replace the a candidate region with a random DNA sequence and study its impact on the K562 CAGE signal (this is called as in-silico mutagenesis). The score is $S(E, G) = |\\hat{y}(original DNA) - \\hat{y}(DNA with region X randomized) | $. They evaluate candidate regsionw with 2-kb windows around this gene's TSS. They use the predicted score to rank enhancer-gene pairs and evaluate how well the ranking recovers the experimentally validated pairs (they use precision-recall curve for this). Authors find Enformer's scores to outperform the baseline Basenji's score (which only evaluated much larger candidates at 20K bp). This experiment alludes to Enformer's prediction depending on biologically relevant regulatory elements. \n\n14. Can Enformer predict what happens when the DNA sequence changes?\n\nAuthors test this using naturally occuring genetic variations in humans and controlled lab experiments that target specific DNA changes. The difference in the prediction scores before and after the change is computed, a positive difference means increased expression and vice-versa. \nFor the first case, they use expression quantitative trait locus (or eQTL) whcih is a genomic location where genetic variation is statitically linked with variation in gene expression, for e.g. \"Across people, those carrying allele G tend to have higher expression of gene Z in liver than those carrying allele A.\" For this the authors use the GTEx project. \nFor the second, they use lab experiments that directly mutate DNA and measure its effect using massively parallel reporter assays (MPRAs). \nFor both cases, Enformer performs better than Basenji2. However, both models struggle with predictions when variants are more than 1kb from the TSS, limiting confidence in predicting impact of distant regulatory mutations. \n\n15. What has the paper established, and what remains unsolved?\n\nThe paper shows that use long-range DNA information improves predictions of measured gene regulation and even show usage of biologically relevant regulatory factors. There are several limitations of the approach:\na. the model is only given DNA sequence as input and therefore it cannot base its predictions on cellular contexts like transcription-factor concentration, signaling state, or chromatin state. \n\nb. The differences in predictions do not establish causal impact. \n\nMainly the paper allows better prioritization: plausible enhancers and variants to test. \n\n# My questions:\n\n1. Since the neighboring bins and tracks are related, how can we use a loss that models that part too?\n\n2. What if we replace convolutions with attention like used in deepseek for long-context modeling?", "source_file": "papers/P08-enformer.md"}, {"id": "P09", "slug": "spliceai", "label": "SpliceAI", "title": "Predicting Splicing from Primary Sequence with Deep Learning", "year": 2019, "publication_type": "Journal article", "group": "genetics", "subcategory": null, "url": "https://doi.org/10.1016/j.cell.2018.12.015", "tags": ["RNA-splicing", "variant-effect-prediction", "sequence-to-function"], "related": [{"id": "P08", "relationship": "Different sequence-to-function targets: gene regulation and RNA splicing."}, {"id": "P10", "relationship": "Complementary variant effects: RNA processing versus amino-acid substitutions."}, {"id": "P12", "relationship": "Compare a dedicated splicing model with a broader regulatory prediction model."}, {"id": "P31", "relationship": "Compare how RNA processing affects a transcript with designing a coding RNA for stability and protein production."}], "summary_html": "", "summary_text": "", "source_file": "papers/P09-spliceai.md"}, {"id": "P10", "slug": "alphamissense", "label": "AlphaMissense", "title": "Accurate proteome-wide missense variant effect prediction with AlphaMissense", "year": 2023, "publication_type": "Journal article", "group": "genetics", "subcategory": null, "url": "https://doi.org/10.112 <script>
'use strict';
const {groups,papers}=JSON.parse(document.getElementById('library-data').textContent);
const byId=new Map(papers.map(p=>[p.id,p]));
const byGroup=new Map(groups.map(g=>[g.id,g]));
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const colorStyle=g=>{
 const rgb=g.rgb.split(',').map(Number),light=rgb.map(c=>Math.round(c*.94)),dark=rgb.map(c=>Math.round(c+(255-c)*.45));
 return `--group-color-light:rgb(${light});--group-rgb-light:${g.rgb};--group-color-dark:rgb(${dark});--group-rgb-dark:${dark}`;
};
$('theme-picker').value=window.libraryTheme.preference;
$('theme-picker').addEventListener('change',event=>window.libraryTheme.set(event.target.value));
let activeGroup='all',activePaper=null,trail=[],origin=null;
const tags=[...new Set(papers.flatMap(p=>p.tags))].sort();
const subcategories=[...new Set(papers.map(p=>p.subcategory).filter(Boolean))].sort();
$('all-count').textContent=papers.length;
$('group-nav').innerHTML=groups.map((g,i)=>`<button class="nav-item" data-group="${esc(g.id)}" style="${colorStyle(g)}" aria-pressed="false"><span class="dot"></span><span class="nav-label">${esc(g.name)}</span><span class="count">${papers.filter(p=>p.group===g.id).length}</span></button>`).join('');
$('mobile-group').innerHTML='<option value="all">All groups</option>'+groups.map(g=>`<option value="${esc(g.id)}">${esc(g.name)}</option>`).join('');
$('tag-filter').insertAdjacentHTML('beforeend',tags.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join(''));
$('subcategory-filter').insertAdjacentHTML('beforeend',subcategories.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join(''));
$('subcategory-filter').hidden=!subcategories.length;
function render(){
 const query=$('search').value.trim().toLocaleLowerCase(),tag=$('tag-filter').value,sub=$('subcategory-filter').value;
 const visible=papers.filter(p=>(activeGroup==='all'||p.group===activeGroup)&&(tag==='all'||p.tags.includes(tag))&&(sub==='all'||p.subcategory===sub)&&(!query||[p.id,p.title,p.label,p.year,p.publication_type,byGroup.get(p.group).name,p.subcategory,...p.tags,p.summary_text].join(' ').toLocaleLowerCase().includes(query)));
 document.querySelectorAll('[data-group]').forEach(el=>{const selected=el.dataset.group===activeGroup;el.classList.toggle('active',selected);el.setAttribute('aria-pressed',String(selected));});
 $('mobile-group').value=activeGroup;
 $('view-title').textContent=activeGroup==='all'?'The collection':byGroup.get(activeGroup).name;
 $('results').textContent=`${visible.length} of ${papers.length} papers`;
 $('reset').hidden=activeGroup==='all'&&tag==='all'&&sub==='all'&&!query;
 let previous=null;
 $('paper-rows').innerHTML=visible.map(p=>{
  const g=byGroup.get(p.group),start=previous!==null&&previous!==p.group;previous=p.group;
  return `<tr id="row-${p.id}" class="${start?'group-start ':''}${activePaper===p.id?'selected':''}" style="${colorStyle(g)}"><td><div class="group-label"><span class="dot"></span><span>${esc(g.name)}</span></div>${p.subcategory?`<span class="subcategory">${esc(p.subcategory)}</span>`:''}</td><td><button class="paper-id" data-paper="${p.id}" aria-label="Open ${p.id}: ${esc(p.label)}">${p.id}</button></td><td><a class="paper-title" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">${esc(p.title)} <span class="external" aria-hidden="true">↗</span></a><div class="paper-meta"><span class="model-label">${esc(p.label)}</span><span>·</span><span>${p.year}</span><span>·</span><span>${esc(p.publication_type)}</span></div></td><td><div class="tag-list">${p.tags.map(t=>`<button class="tag ${tag===t?'active':''}" data-tag="${esc(t)}" aria-label="Filter by ${esc(t)}">${esc(t)}</button>`).join('')}</div></td><td>${p.summary_text?`<button class="summary-button" data-paper="${p.id}" aria-label="Read your summary of ${p.id}">View summary</button>`:'<span class="empty-summary" aria-label="No summary written">—</span>'}</td><td><div class="relations">${p.related.map(r=>`<a class="related-id" href="#${r.id}" data-paper="${r.id}" title="${esc(byId.get(r.id).label+': '+r.relationship)}" aria-label="Open related paper ${r.id}: ${esc(byId.get(r.id).label)}">${r.id}</a>`).join('')||'<span class="empty-summary">—</span>'}</div></td></tr>`;
 }).join('');
 $('empty-state').hidden=visible.length!==0;
}
function reset(){activeGroup='all';$('search').value='';$('tag-filter').value='all';$('subcategory-filter').value='all';render();}
function openPaper(id,remember=true){
 const p=byId.get(id);if(!p)return;
 const dialog=$('paper-dialog'),g=byGroup.get(p.group);
 if(!dialog.open){origin=document.activeElement;trail=[];}else if(remember&&activePaper&&activePaper!==id){trail.push(activePaper);}
 activePaper=id;
 $('detail-id').textContent=id+' / PAPER NOTES';
 $('detail-id').hidden=trail.length>0;
 $('detail-back').hidden=!trail.length;
 $('detail-back').textContent=trail.length?'← Back to '+trail[trail.length-1]:'';
 $('detail-body').style.cssText=colorStyle(g);
 $('detail-body').innerHTML=`<div class="detail-category"><span class="dot"></span>${esc(g.name)}${p.subcategory?' / '+esc(p.subcategory):''}</div><h2 class="detail-title" id="detail-title" tabindex="-1">${esc(p.title)}</h2><div class="detail-meta">${p.id} · ${p.year} · ${esc(p.publication_type)} &nbsp; <a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">Open publication ↗</a>${(p.additional_urls||[]).map(l=>`<br><a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.label)} ↗</a>`).join('')}</div><div class="tag-list detail-tags">${p.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><section class="detail-section"><h3>My summary</h3>${p.summary_text?`<div class="summary-content">${p.summary_html}</div>`:'<div class="summary-empty">Your summary will appear here.</div>'}</section><section class="detail-section"><h3>Related papers${p.related.length?' · '+p.related.length:''}</h3><div class="connection-list">${p.related.map(r=>{const target=byId.get(r.id);return `<a class="connection" href="#${r.id}" data-paper="${r.id}"><span>${r.id} ↗</span><div><strong>${esc(target.label)}</strong><small>${esc(r.relationship)}</small></div></a>`;}).join('')||'<p>No connections added yet.</p>'}</div></section>`;
 history.replaceState(null,'','#'+id);
 if(!dialog.open)dialog.showModal();
 dialog.scrollTop=0;$('detail-title').focus();
 document.querySelectorAll('#paper-rows tr').forEach(row=>row.classList.toggle('selected',row.id==='row-'+id));
}
document.addEventListener('click',event=>{
 const paper=event.target.closest('[data-paper]');if(paper){event.preventDefault();openPaper(paper.dataset.paper);return;}
 const group=event.target.closest('[data-group]');if(group){activeGroup=group.dataset.group;render();return;}
 const tag=event.target.closest('[data-tag]');if(tag){$('tag-filter').value=tag.dataset.tag;render();return;}
 if(event.target.closest('[data-reset]'))reset();
});
$('search').addEventListener('input',render);
$('tag-filter').addEventListener('change',render);
$('subcategory-filter').addEventListener('change',render);
$('mobile-group').addEventListener('change',event=>{activeGroup=event.target.value;render();});
$('reset').addEventListener('click',reset);
$('close-dialog').addEventListener('click',()=>$('paper-dialog').close());
$('detail-back').addEventListener('click',()=>{const id=trail.pop();if(id)openPaper(id,false);});
$('paper-dialog').addEventListener('click',event=>{if(event.target===$('paper-dialog')){const r=event.target.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)event.target.close();}});
$('paper-dialog').addEventListener('close',()=>{activePaper=null;trail=[];history.replaceState(null,'',location.pathname+location.search);document.querySelectorAll('#paper-rows tr.selected').forEach(row=>row.classList.remove('selected'));if(origin&&origin.isConnected)origin.focus();});
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(byId.has(id))openPaper(id);else if($('paper-dialog').open)$('paper-dialog').close();});
render();
if(byId.has(location.hash.slice(1)))openPaper(location.hash.slice(1));
</script>
</body>
</html>
