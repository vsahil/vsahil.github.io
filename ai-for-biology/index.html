<script>
(()=>{
 const key='ai-bio-theme',system=window.matchMedia('(prefers-color-scheme: dark)');
 let preference='system';
 try{const saved=localStorage.getItem(key);if(['light','dark'].includes(saved))preference=saved;}catch{}
 function apply(){document.documentElement.dataset.theme=preference==='system'?(system.matches?'dark':'light'):preference;}
 window.libraryTheme={get preference(){return preference;},set(value){
  preference=['light','dark'].includes(value)?value:'system';
  try{if(preference==='system')localStorage.removeItem(key);else localStorage.setItem(key,preference);}catch{}
  apply();
 }};
 if(system.addEventListener)system.addEventListener('change',apply);else system.addListener(apply);
 apply();
})();
</script>

Highly accurate protein structure prediction with AlphaFold", "year": 2021, "publication_type": "Journal article", "group": "structure", "subcategory": null, "url": "https://www.nature.com/articles/s41586-021-03819-2", "tags": ["protein-sequence", "multiple-sequence-alignment", "geometric-deep-learning", "structure-prediction"], "related": [{"id": "P02", "relationship": "Compare evolutionary alignments with protein language-model representations for structure prediction."}, {"id": "P03", "relationship": "Follow the progression from protein structure to mixed biomolecular complex prediction."}, {"id": "P05", "relationship": "Compare a single predicted structure with a distribution of conformations."}, {"id": "P06", "relationship": "Compare sequence-to-structure prediction with structure-to-sequence design."}, {"id": "P10", "relationship": "AlphaMissense adapts AlphaFold representations for variant interpretation."}], "summary_html": "\u003cp\u003e1. What is a protein, and why does its three-dimensional structure matter?\u003c/p\u003e\n\u003cp\u003eProtein is a sequence of amino-acids (which in a sequence is called as residue) and folds into a 3-D structure that determines the function the protein accomplishes. \u003c/p\u003e\n\u003cp\u003e2. What exactly is the prediction problem?\u003c/p\u003e\n\u003cp\u003eThe prediction problem at its simplest is to predict the 3-dimensional atomic coordinates of the protein given its amino-acid sequence. It does require the model to predict the physical simulation of the folding process itself, just the final structure. \u003c/p\u003e\n\u003cp\u003e3. Does a protein have one correct structure?\u003c/p\u003e\n\u003cp\u003eThe same protein can have multiple structures under cases of movement of atoms, distinct functional states (like open and closed state), dependence on binding partners (like another protein, DNA, RNA, small molecule). \u003c/p\u003e\n\u003cp\u003e4. Where do the training labels come from?\u003c/p\u003e\n\u003cp\u003eThe training labels come from the PDB database where researchers have deposited 3-D structures that were collected using various techniques like X-ray crystallography, cryo-electron microscopy, Nuclear Magnetic Resonance (NMR). Due to the limitations of the measurement tools and the fact that the protein can occur in multiple states, one experiment might determine the shape of the open structure and another experiment might determine the shape of the closed one. Another problem happens due to fluctuations where a side chain of a protein might adopt different positions and researchers can assign an occupancy, estimating the fraction of each position. In another case, a flexible part might adopt too many arrangements for any tool to reliably measure, in which case the deposited structure can have missing coordinates for that part. \u003c/p\u003e\n\u003cp\u003e5. Why was this problem difficult before AlphaFold2?\u003c/p\u003e\n\u003cp\u003eBefore AlphaFold2, people tried simulating the physics that atoms follow to fold, but the number of states is enormous and physics models not that accurate. \u003c/p\u003e\n\u003cp\u003e6. What information does AlphaFold2 actually receive?\u003c/p\u003e\n\u003cp\u003eAlphaFold2 takes 3 inputs: (a) the target sequence which is the sequence of amino acids whose structure we want to predict, (b) Multiple Sequence Alignment (MSA) which are evolutionary related sequences that are arranged for a comparison, and (c) related proteins whose 3-D structure is available. \u003c/p\u003e\n\u003cp\u003eMSA aligns related sequences like this: \u003c/p\u003e\n\u003cp\u003eTarget: A C D - E F G H\u003c/p\u003e\n\u003cp\u003eRel 1 : A C D K E Y G H\u003c/p\u003e\n\u003cp\u003eRel 2 : V C E - E F G H\u003c/p\u003e\n\u003cp\u003eThis shows positions that were (a) conserved through evolution alluding to its importance in structural stability or function, (b) tolerated substitutions (a position might change while retaining key property like hydrophobicity), (c) insertions and deletions (they reveal where related sequences differ in length, potentially informing which parts tolerate structural changes). Conceptually to find MSA you would look for sequence matches, score them, and then use a protein\u0026#x27;s family to find more distant relatives. AlphaFold2 uses JackHmmer and HHbits for this purpose. The resulting matches are candidates for evolutionary relationships. \u003c/p\u003e\n\u003cp\u003eFor structural templates, you use the same pipeline in the MSA stage to find relevant sequences and then find their structure using PDB (and ranks them using a tool called HHSearch based on the number of correctly aligned residues). \u003c/p\u003e\n\u003cp\u003e7. Why should evolution tell us anything about structure?\u003c/p\u003e\n\u003cp\u003eThis is because evolution will favor changes that will retain its biological role (otherwise the organism might not be reproductively successful). The result is different sequences that preserve structural similarity. Consider the case where position 20 has a big amino acid and position 65 has a small one. So the combinations of (big, small) and (small, big) are more likely to occur than (big, big) and (small, small) if these two positions are close in 3-D space. So the effect on one amino acid depends on what is in another position. This dependence is called epistasis. Spatial interaction is one of the reasons for epistatis (along with shared ancestry, indirect dependence, and other biological constraints). AlphaFold2 learns from these evolutionary patterns and experimentally determined 3-D structures. \u003c/p\u003e\n\u003cp\u003e8. What is the central computational idea?\u003c/p\u003e\n\u003cp\u003eThe main part of the network is termed as Evoformer. It repeatedly updates two sets of learned features: one representing the aligned sequences and another representing relationships between residues in the target sequence. If S is the number of MSA sequences and L is the number of positions in the target, then MSA is represented by $S \u003cem\u003e L \u003c/em\u003e d_{MSA}$ (a learned feature vector for one position in one MSA sequence) and the pair representation by $L \u003cem\u003e L \u003c/em\u003e d_{pair}$ (a learned feature describing relationship between target positions i and j). In the first pass, the representations along the MSA are processed: across positions within a sequence and across sequences at the same column position. In the next pass information is exchanged between MSA and pair representations (this combines features at position i and j within each aligned sequence and then aggregates across sequences, this operation is termed as outer product mean). In the third step the relations between pairs is updated using a third position, so consider three residues i, j, and k. Information abotu relationships i - k and j - k can help refine the relationship i - j. This involves triangle updates. Several Evoformer blocks are applied in succession and their output is a set of learned representations. \u003c/p\u003e\n\u003cp\u003e9. How does the model turn those representations into a three-dimensional protein?\u003c/p\u003e\n\u003cp\u003eThis happens in the structure module. It receives (1) a feature vector for each residue in the target (from the target\u0026#x27;s sequence row in the processes MSA) and (2) the pair representation (feature vectors describing relationships between each pair of target residues). These features contain the information for the atomic coordinates. First each residue is assigned a local coordinate frame : an origin plus 3 perpendicular axes. For protein residues this is the position for 3 atoms: a nitrogen, central carbon called Cα(the origin), and next backbone carbon. Each residue\u0026#x27;s frame is representation by a rotation R_i and translation t_i, therefore an atom\u0026#x27;s local position is expressed as R_i * x_{loc} + t_i in the global space. Predicting both orientation and position is important because two residues can have their Cαcarbons very close while their side chains are protroding in different directions. Initially all residue frames have same orientation and are at origin (an impossible state) and are repeatedly revised. It alternates between updating the residue features and their geometric frames. The feature update using invariant point attention (IPA) which combines three kinds of information: (a) query-key similarity between features, (b) information from pair representation, (c) distances between learned query and key points in 3-D space. The updated features then predict a change in each residue\u0026#x27;s position and orientation. IPA is designed so that rotating or translating all the residue frames leaves the output features unchanged. This is invariance. This also allows for equivariant updates to the rest of the arrangement. Finally atoms are placed by predicting torsion angles (rotations around particular bonds) to position the side-chains. \u003c/p\u003e\n\u003cp\u003e10. How does the model learn and refine its predictions?\u003c/p\u003e\n\u003cp\u003eAlphaFold2 is trained with several losses combined. The obvious one is the supervised structure prediction (which is done in a way that is wrt to the global orientation and origin -- so the loss is called as frame-aligned point error). The other losses are (a) intermediate structure and torsion-angle losses, distance-distribution prediction (called a distogram), masked-MSA prediction (reconstructs hidden amino acids), structural violation penalties, (d) confidence prediction. There is also recycling which repeats the whole network (evoformer + structure module), so information from one pass becomes additional input to the next pass. The network therefore gets to reconsider its prediction. The last recipe is self-distillation where a trained model generates structures for additional sequences and a new model trains on pseudo-labels + the experimental structures using confidence filtering and harder input augmentations like MSA subsampling. This expands the training examples over which the model learns. \u003c/p\u003e\n\u003cp\u003e11. How is prediction accuracy measured?\u003c/p\u003e\n\u003cp\u003eThere are several metrics that are used for measuring the prediction accuracy, the obvious one is the difference with the experimentally determined reference structure. However just doing a L2 loss is not sufficient as different regions can be accurate while their relative arrangement can be wrong or the backbone can be accurate while the side chains misplaced.\u003c/p\u003e\n\u003cp\u003e(a) RMSD: rotate and translate the predicted structure to overlap the reference as much as possible (superposition) RMSD is root mean square distance (measured in angstrom) and lower is better. Since this is sensitive to outliers, AlphaFold2 reports RMSD_{95} which is the RMSD for best fitting 95% of the positions. Lower is better. \u003c/p\u003e\n\u003cp\u003e(b) lDDT (local distance difference test): this compares distances within each structure. So for e.g. residue 20 and 65 are 7A apart in reference and 7.3 in prediction, so 0.3 is the distance error. Local means nearby in 3-D space note necessarily adjacent in amino acid sequence. lDDT-Cαcompares only the central Cαatoms, one per residue. Higher is better. \u003c/p\u003e\n\u003cp\u003e(c) GDT (global distance test): what percentage of Cαatoms are be superposed within specific error thresholds (like 1, 2, 4, and 8A). Higher is better. \u003c/p\u003e\n\u003cp\u003e(d) TM-score (template modeling score): this is better when there are distinct domains in the protein and scoring each domain separately can show better agreement. \u003c/p\u003e\n\u003cp\u003eFor biological role, the error of a location also matter, for example error at the binding site is worse than an error at some other site. However these metrics don\u0026#x27;t consider that. \u003c/p\u003e\n\u003cp\u003e12. How convincing is the evaluation, and does it show generalization to unfamiliar proteins?\u003c/p\u003e\n\u003cp\u003eCASP (Critical Assessment of protein Structure Prediction) is the task to predict structures of the pubicly undisclosed protein, across 87 proteins AlphaFold2 performed the best:\u003c/p\u003e\n\u003cp\u003e| Median error; lower is better | AlphaFold2 | Best competing method | |---|---:|---:| | Backbone Cα RMSD at 95% coverage | \u003cstrong\u003e0.96 Å\u003c/strong\u003e | 2.8 Å | | All-atom RMSD at 95% coverage | \u003cstrong\u003e1.5 Å\u003c/strong\u003e | 3.5 Å |\u003c/p\u003e\n\u003cp\u003eAnother evaluation was done on 3144 proteins chains published on PDB after the training cutoff (temporal split) after filtering for proteins with similar sequences. The median full-chain backbone RMSD at 95% coverage was 1.46 Å. \u003c/p\u003e\n\u003cp\u003e13. Which design choices actually explain the improvement?\u003c/p\u003e\n\u003cp\u003eAuthors performed several ablation experiments and measured accuracy on CASP14 and PDB dataset. \u003c/p\u003e\n\u003cp\u003e| Component tested | What the evidence shows | |---|---| | \u003cstrong\u003eSelf-distillation\u003c/strong\u003e | Training with predicted structures improves accuracy. | | \u003cstrong\u003eMasked-MSA prediction loss\u003c/strong\u003e | This auxiliary task helps structural prediction, particularly with shallow MSAs. | | \u003cstrong\u003eRecycling\u003c/strong\u003e | Repeated refinement helps across different MSA depths. | | \u003cstrong\u003eEnd-to-end structure gradients\u003c/strong\u003e | Allowing coordinate-based losses to train the Evoformer improves accuracy. | | \u003cstrong\u003eSpecialized Evoformer operations\u003c/strong\u003e | Replacing the combination of triangle operations, pair biases, and gating with simpler attention reduces accuracy. | | \u003cstrong\u003eDistogram loss\u003c/strong\u003e | Removing this has a surprisingly small effect. |\u003c/p\u003e\n\u003cp\u003eThe combined evoformer operations do not isolate the effects of its 3 individual contributions. The removal of distogram loss also does not remove the pair representation, its just removes that loss. \u003c/p\u003e\n\u003cp\u003e14. How does AlphaFold2 estimate confidence, and should we trust those estimates?\u003c/p\u003e\n\u003cp\u003ea. pLDDT: this predicts how accurate is the local structure around this residue. This is the model\u0026#x27;s prediction of the lDDT score. It learns to predict the lDDT-Cα from the network\u0026#x27;s internal features. \u003c/p\u003e\n\u003cp\u003eb. PAE: this predicts how accurately one residue is positioned relative to the other? Predicted aligned error address relative placement. It is trained by first aligning the predicted and experimental structure and measuring how far the predicted Cα two residues are from their experimental position. PAE is not the predicted distance between two residues, its the error in their relative placement. \u003c/p\u003e\n\u003cp\u003eWe need both because pLDDt can be low and PAE can still be high (so within the internal structure the model is confident but uncertain about the relative placement)\u003c/p\u003e\n\u003cp\u003ec. pTM: this is the predicted global TM-score, higher values indicate greater global accuracy. \u003c/p\u003e\n\u003cp\u003e15. What has AlphaFold2 established—and what remains unsolved?\u003c/p\u003e\n\u003cp\u003eAlphaFold2 represents a big advancement in predicting protein structures from sequence, evolutionary information, and templates. However, its limitations include not being to predict all conformations of a protein or their probabilities under different conformations, lower accuracy with shallow MSAs and difficulties for chains whose structure depends on interactions with other proteins. \u003c/p\u003e\n\u003cp\u003eMy Questions: \u003c/p\u003e\n\u003cp\u003e1. Why is this architecture is the best to process this kind of information? Can we make a more efficient one say by being influenced by the Mamba kind of architectures introduced for LLMs. I would like to ablate all of the architectural choices made in the paper to understand the impact of each of them? \u003c/p\u003e\n\u003cp\u003e2. Is there a way to not use the MSA information and still perform well on the prediction task? \u003c/p\u003e\n\u003cp\u003e3. What if we introduce a functionality based error metric ?\u003c/p\u003e", "summary_text": "1. What is a protein, and why does its three-dimensional structure matter?\n\nProtein is a sequence of amino-acids (which in a sequence is called as residue) and folds into a 3-D structure that determines the function the protein accomplishes. \n\n2. What exactly is the prediction problem?\n\nThe prediction problem at its simplest is to predict the 3-dimensional atomic coordinates of the protein given its amino-acid sequence. It does require the model to predict the physical simulation of the folding process itself, just the final structure. \n\n3. Does a protein have one correct structure?\n\nThe same protein can have multiple structures under cases of movement of atoms, distinct functional states (like open and closed state), dependence on binding partners (like another protein, DNA, RNA, small molecule). \n\n4. Where do the training labels come from?\n\nThe training labels come from the PDB database where researchers have deposited 3-D structures that were collected using various techniques like X-ray crystallography, cryo-electron microscopy, Nuclear Magnetic Resonance (NMR). Due to the limitations of the measurement tools and the fact that the protein can occur in multiple states, one experiment might determine the shape of the open structure and another experiment might determine the shape of the closed one. Another problem happens due to fluctuations where a side chain of a protein might adopt different positions and researchers can assign an occupancy, estimating the fraction of each position. In another case, a flexible part might adopt too many arrangements for any tool to reliably measure, in which case the deposited structure can have missing coordinates for that part. \n\n5. Why was this problem difficult before AlphaFold2?\n\nBefore AlphaFold2, people tried simulating the physics that atoms follow to fold, but the number of states is enormous and physics models not that accurate. \n\n6. What information does AlphaFold2 actually receive?\n\nAlphaFold2 takes 3 inputs: (a) the target sequence which is the sequence of amino acids whose structure we want to predict, (b) Multiple Sequence Alignment (MSA) which are evolutionary related sequences that are arranged for a comparison, and (c) related proteins whose 3-D structure is available. \n\nMSA aligns related sequences like this: \n\nTarget: A C D - E F G H\n\nRel 1 : A C D K E Y G H\n\nRel 2 : V C E - E F G H\n\nThis shows positions that were (a) conserved through evolution alluding to its importance in structural stability or function, (b) tolerated substitutions (a position might change while retaining key property like hydrophobicity), (c) insertions and deletions (they reveal where related sequences differ in length, potentially informing which parts tolerate structural changes). Conceptually to find MSA you would look for sequence matches, score them, and then use a protein's family to find more distant relatives. AlphaFold2 uses JackHmmer and HHbits for this purpose. The resulting matches are candidates for evolutionary relationships. \n\nFor structural templates, you use the same pipeline in the MSA stage to find relevant sequences and then find their structure using PDB (and ranks them using a tool called HHSearch based on the number of correctly aligned residues). \n\n7. Why should evolution tell us anything about structure?\n\nThis is because evolution will favor changes that will retain its biological role (otherwise the organism might not be reproductively successful). The result is different sequences that preserve structural similarity. Consider the case where position 20 has a big amino acid and position 65 has a small one. So the combinations of (big, small) and (small, big) are more likely to occur than (big, big) and (small, small) if these two positions are close in 3-D space. So the effect on one amino acid depends on what is in another position. This dependence is called epistasis. Spatial interaction is one of the reasons for epistatis (along with shared ancestry, indirect dependence, and other biological constraints). AlphaFold2 learns from these evolutionary patterns and experimentally determined 3-D structures. \n\n8. What is the central computational idea?\n\nThe main part of the network is termed as Evoformer. It repeatedly updates two sets of learned features: one representing the aligned sequences and another representing relationships between residues in the target sequence. If S is the number of MSA sequences and L is the number of positions in the target, then MSA is represented by $S * L * d_{MSA}$ (a learned feature vector for one position in one MSA sequence) and the pair representation by $L * L * d_{pair}$ (a learned feature describing relationship between target positions i and j). In the first pass, the representations along the MSA are processed: across positions within a sequence and across sequences at the same column position. In the next pass information is exchanged between MSA and pair representations (this combines features at position i and j within each aligned sequence and then aggregates across sequences, this operation is termed as outer product mean). In the third step the relations between pairs is updated using a third position, so consider three residues i, j, and k. Information abotu relationships i - k and j - k can help refine the relationship i - j. This involves triangle updates. Several Evoformer blocks are applied in succession and their output is a set of learned representations. \n\n9. How does the model turn those representations into a three-dimensional protein?\n\nThis happens in the structure module. It receives (1) a feature vector for each residue in the target (from the target's sequence row in the processes MSA) and (2) the pair representation (feature vectors describing relationships between each pair of target residues). These features contain the information for the atomic coordinates. First each residue is assigned a local coordinate frame : an origin plus 3 perpendicular axes. For protein residues this is the position for 3 atoms: a nitrogen, central carbon called Cα(the origin), and next backbone carbon. Each residue's frame is representation by a rotation R_i and translation t_i, therefore an atom's local position is expressed as R_i * x_{loc} + t_i in the global space. Predicting both orientation and position is important because two residues can have their Cαcarbons very close while their side chains are protroding in different directions. Initially all residue frames have same orientation and are at origin (an impossible state) and are repeatedly revised. It alternates between updating the residue features and their geometric frames. The feature update using invariant point attention (IPA) which combines three kinds of information: (a) query-key similarity between features, (b) information from pair representation, (c) distances between learned query and key points in 3-D space. The updated features then predict a change in each residue's position and orientation. IPA is designed so that rotating or translating all the residue frames leaves the output features unchanged. This is invariance. This also allows for equivariant updates to the rest of the arrangement. Finally atoms are placed by predicting torsion angles (rotations around particular bonds) to position the side-chains. \n\n10. How does the model learn and refine its predictions?\n\nAlphaFold2 is trained with several losses combined. The obvious one is the supervised structure prediction (which is done in a way that is wrt to the global orientation and origin -- so the loss is called as frame-aligned point error). The other losses are (a) intermediate structure and torsion-angle losses, distance-distribution prediction (called a distogram), masked-MSA prediction (reconstructs hidden amino acids), structural violation penalties, (d) confidence prediction. There is also recycling which repeats the whole network (evoformer + structure module), so information from one pass becomes additional input to the next pass. The network therefore gets to reconsider its prediction. The last recipe is self-distillation where a trained model generates structures for additional sequences and a new model trains on pseudo-labels + the experimental structures using confidence filtering and harder input augmentations like MSA subsampling. This expands the training examples over which the model learns. \n\n11. How is prediction accuracy measured?\n\nThere are several metrics that are used for measuring the prediction accuracy, the obvious one is the difference with the experimentally determined reference structure. However just doing a L2 loss is not sufficient as different regions can be accurate while their relative arrangement can be wrong or the backbone can be accurate while the side chains misplaced.\n\n(a) RMSD: rotate and translate the predicted structure to overlap the reference as much as possible (superposition) RMSD is root mean square distance (measured in angstrom) and lower is better. Since this is sensitive to outliers, AlphaFold2 reports RMSD_{95} which is the RMSD for best fitting 95% of the positions. Lower is better. \n\n(b) lDDT (local distance difference test): this compares distances within each structure. So for e.g. residue 20 and 65 are 7A apart in reference and 7.3 in prediction, so 0.3 is the distance error. Local means nearby in 3-D space note necessarily adjacent in amino acid sequence. lDDT-Cαcompares only the central Cαatoms, one per residue. Higher is better. \n\n(c) GDT (global distance test): what percentage of Cαatoms are be superposed within specific error thresholds (like 1, 2, 4, and 8A). Higher is better. \n\n(d) TM-score (template modeling score): this is better when there are distinct domains in the protein and scoring each domain separately can show better agreement. \n\nFor biological role, the error of a location also matter, for example error at the binding site is worse than an error at some other site. However these metrics don't consider that. \n\n12. How convincing is the evaluation, and does it show generalization to unfamiliar proteins?\n\nCASP (Critical Assessment of protein Structure Prediction) is the task to predict structures of the pubicly undisclosed protein, across 87 proteins AlphaFold2 performed the best:\n\n| Median error; lower is better | AlphaFold2 | Best competing method |\n|---|---:|---:|\n| Backbone Cα RMSD at 95% coverage | **0.96 Å** | 2.8 Å |\n| All-atom RMSD at 95% coverage | **1.5 Å** | 3.5 Å |\n\nAnother evaluation was done on 3144 proteins chains published on PDB after the training cutoff (temporal split) after filtering for proteins with similar sequences. The median full-chain backbone RMSD at 95% coverage was 1.46 Å. \n\n13. Which design choices actually explain the improvement?\n\nAuthors performed several ablation experiments and measured accuracy on CASP14 and PDB dataset. \n\n| Component tested | What the evidence shows |\n|---|---|\n| **Self-distillation** | Training with predicted structures improves accuracy. |\n| **Masked-MSA prediction loss** | This auxiliary task helps structural prediction, particularly with shallow MSAs. |\n| **Recycling** | Repeated refinement helps across different MSA depths. |\n| **End-to-end structure gradients** | Allowing coordinate-based losses to train the Evoformer improves accuracy. |\n| **Specialized Evoformer operations** | Replacing the combination of triangle operations, pair biases, and gating with simpler attention reduces accuracy. |\n| **Distogram loss** | Removing this has a surprisingly small effect. |\n\nThe combined evoformer operations do not isolate the effects of its 3 individual contributions. The removal of distogram loss also does not remove the pair representation, its just removes that loss. \n\n14. How does AlphaFold2 estimate confidence, and should we trust those estimates?\n\na. pLDDT: this predicts how accurate is the local structure around this residue. This is the model's prediction of the lDDT score. It learns to predict the lDDT-Cα from the network's internal features. \n\nb. PAE: this predicts how accurately one residue is positioned relative to the other? Predicted aligned error address relative placement. It is trained by first aligning the predicted and experimental structure and measuring how far the predicted Cα two residues are from their experimental position. PAE is not the predicted distance between two residues, its the error in their relative placement. \n\nWe need both because pLDDt can be low and PAE can still be high (so within the internal structure the model is confident but uncertain about the relative placement)\n\nc. pTM: this is the predicted global TM-score, higher values indicate greater global accuracy. \n\n15. What has AlphaFold2 established—and what remains unsolved?\n\nAlphaFold2 represents a big advancement in predicting protein structures from sequence, evolutionary information, and templates. However, its limitations include not being to predict all conformations of a protein or their probabilities under different conformations, lower accuracy with shallow MSAs and difficulties for chains whose structure depends on interactions with other proteins. \n\nMy Questions: \n\n1. Why is this architecture is the best to process this kind of information? Can we make a more efficient one say by being influenced by the Mamba kind of architectures introduced for LLMs. I would like to ablate all of the architectural choices made in the paper to understand the impact of each of them? \n\n2. Is there a way to not use the MSA information and still perform well on the prediction task? \n\n3. What if we introduce a functionality based error metric ?", "source_file": "papers/P01-alphafold2.md"}, {"id": "P02", "slug": "esmfold", "label": "ESM-2 / ESMFold", "title": "Evolutionary-scale prediction of atomic-level protein structure with a language model", "year": 2023, "publication_type": "Journal article", "group": "structure", "subcategory": null, "url": "https://www.science.org/doi/10.1126/science.ade2574", "tags": ["protein-language-model", "masked-language-modeling", "structure-prediction", "metagenomics"], "related": [{"id": "P01", "relationship": "Compare evolutionary alignments with protein language-model representations for structure prediction."}, {"id": "P04", "relationship": "Compare successive generations of ESM language models and folding models."}, {"id": "P05", "relationship": "AlphaFlow / ESMFlow adapt structure predictors to generate conformational ensembles."}], "summary_html": "\u003cp\u003e1. What is a protein, and what does its “structure” mean?\u003c/p\u003e\n\u003cp\u003eA protein is a sequence of amino-acids (now called as residues). Its structure is the 3-D coordinates of the atoms. Note that proteins can occur in multiple conformations. \u003c/p\u003e\n\u003cp\u003e2. Why does knowing a protein’s structure matter?\u003c/p\u003e\n\u003cp\u003eA protein\u0026#x27;s structure suggests its biological role, although the function can depend on molecular interactions and surrounding conditions. \u003c/p\u003e\n\u003cp\u003e3. What problem remains after AlphaFold2?\u003c/p\u003e\n\u003cp\u003eEven though AlphaFold2 achieves impressive accuracy, its extremely expensive because of the MSA alignment process. ESMFold aims to achieve protein structure prediction at a much larger scale by incorporating the evolutionary patterns once during pretraining and then not using the MSA search at inference time. \u003c/p\u003e\n\u003cp\u003e4. Why should protein sequences contain information about structure?\u003c/p\u003e\n\u003cp\u003eThis happens because of evolution which favors mutations in the protein that mostly preserves its functionality. Similar to the discussion in the AlphaFold2 paper, correlated changes (changes at two positions together) happens if those preserve the role, it doesn\u0026#x27;t directly mean that those two are in physical contact (it can arise from ancestry, indirect influence, or other constraints). Proteins descended from a shared ancestor is called as homologs and MSA is the process of aligning them appropriately. The hypothesis of this paper is that a model trained to fill in missing amino acids across many natural sequences must learn those constraints well and therefore its representations might contain useful information about the structure -- even though the pre-training objective might not ask for it. ESMFold tries to utilize that information without using explicit MSA alignment. \u003c/p\u003e\n\u003cp\u003e5. Where do the data come from, and what do they actually represent?\u003c/p\u003e\n\u003cp\u003e(a) ESM pre-training: This uses 65M protein sequences from Uniref50 and Uniref90 databases (which clusters proteins based on 50% and 90% sequence-identity threshold) and since some clusters are much larger than others (because researchers have studied them more), they sample across clusters to get a more diverse sample. The pre-training objective here is to predict the identities of hidden amino-acids, not the structural coordinates. \u003c/p\u003e\n\u003cp\u003e(b) They also use about 325K protein structures from PDB (structures available before May 2020 which comes using X-ray crystallography, cryo-EM, or NMR) and also generate about 13M structures using AlphaFold2. These two structures are used to train ESMFold (75% from generated structures and 25% from PDB). \u003c/p\u003e\n\u003cp\u003e6. What are ESM-2 and ESMFold, and how do their roles differ?\u003c/p\u003e\n\u003cp\u003eESM-2 learns representations of protein sequences and EMSFold uses those representations to predict a protein\u0026#x27;s structure. So the first stage is to train ESM-2. This is a BERT style training where some amino acids are hidden or corrupted and the model learns to recover their identities from context. It produces a hidden vector for each residue which can encode information useful for structure prediction, even though ESM-2 receives no structural labels. The second stage is to train ESMFold where the pretrained language model is frozen, additional components like folding trunk and a structure module are trained which produce the 3-D structure. The inference path is Amino-acid sequence --\u0026gt; ESM-2 representations --\u0026gt; folding trunk --\u0026gt; structure module --\u0026gt; coordinates (and confidence). \u003c/p\u003e\n\u003cp\u003e7. What does the claim \u0026quot;structure emerges in a language model\u0026quot; actually mean?\u003c/p\u003e\n\u003cp\u003eThe authors perform two experiments to verify the claim that ESM-2 learns structural information that can be used for structure prediction without being trained on structural labels. \u003c/p\u003e\n\u003cp\u003e(a) can its attention pattern predict which residues are in contact? they train a logistic regression model on the attention heads across layers to predict contacts (this regression model is trained just using 20 proteins with known structures and then evaluated on 14,800 proteins). It is shown that the models produce decent prediction accuracy for this task. \u003c/p\u003e\n\u003cp\u003e(b) can its representations support atomic-coordinate prediction? they freeze the ESM-2 model and train a structure module directly on its representation without the folding trunk business, and evaluate on CAMEO and CASP14. As ESM-2\u0026#x27;s size is increased from 8M to 15B, the accuracy of the structure prediction improves. This is similar to the linear probe experiments in ML for checking representation quality (except that in this case the probe itself is non-linear). \u003c/p\u003e\n\u003cp\u003eTherefore using these two experiments, the authors conclude that sequence-only pretraining learns features useful for predicting structure and scaling the pretraining makes the representations better.\u003c/p\u003e\n\u003cp\u003e8. How does ESMFold turn a amino-acid sequence into a structure?\u003c/p\u003e\n\u003cp\u003eThere are 4 steps in this process:  (a) ESM-2 produces contextual representations of the residues in the sequence. ESMFold takes a learned weighted combination of ESM-2\u0026#x27;s layer outputs (rather than just the last layer\u0026#x27;s output) and then passes it through an MLP to initialize its residue representation. For a protein of length L, the folding trunk maintains two representation: (i) residue representation: an L \u003cem\u003e 1024 array (ii) pair representation: L \u003c/em\u003e L * 128 array - one feature vector per residue pair. \u003c/p\u003e\n\u003cp\u003e(b) The folding trunk refines the relations between residues. It contains 48 folding blocks and each block lets the two representation inform one another: pair features impact self-attention over residues, updated residues impact the pair representation, and triangular updates combine information about pairs (i, k) and (k, j) to update relation between i and j. \u003c/p\u003e\n\u003cp\u003e(c) The structure module constructs the 3D arrangement. This is very similar to the structure module in AlphaFold2: it predicts local coordinate frames for residues and predicts the atomic positions. \u003c/p\u003e\n\u003cp\u003e(d) Similar to AlphaFold2, there is recycling where the model feeds information from a prediction back through the folding components allowing revision to the arrangement (they do fixed 3 times recycling). \u003c/p\u003e\n\u003cp\u003eSo the last 3 steps are quite similar to AlphaFold2, just that the MSA sequence step is changed and the pre-training representations themselves should subsume that part. \u003c/p\u003e\n\u003cp\u003e9. How do we know whether the predictions are good?\u003c/p\u003e\n\u003cp\u003eAgain similar to AlphaFold2 they use a temporal split to measure the accuracy of the structures. They use CAMEO (194 structures) and CASP14 (51 structures) for this, with RMSD, TM-score and LDDT being the metrics. \u003c/p\u003e\n\u003cp\u003e10. Where does ESMFold succeed, and where does it struggle, and how does it compare to AlphaFold2?\u003c/p\u003e\n\u003cp\u003eIt performs the best on sequences whose perplexity with ESM-2 is low (means they are modeled well). The breakdown by this perplexity is clearly influencing the structure prediction performance:\u003c/p\u003e\n\u003cp\u003e| Test group | ESMFold mean TM-score | AlphaFold2 | |---|---:|---:| | CAMEO easy: 97 proteins | 0.90 | 0.93 | | CAMEO medium: 89 proteins | 0.79 | 0.86 | | CAMEO hard: 8 proteins | 0.45 | 0.62 | | CASP14: 51 targets | 0.68 | 0.85 |\u003c/p\u003e\n\u003cp\u003eAlso avoiding an MSA does not automatically make EMSFold better on proteins with few relatives, this is because even though on paper it might seem that ESMFold should be better with them, the ESM-2 representations aren\u0026#x27;t good for those orphan proteins. Also prediction protein-complexes is substantially less reliable because EMSFold was trained on individual chains. \u003c/p\u003e\n\u003cp\u003eAuthors also perform ablation experiments on the architectural components and find that remove the language model or removing the folding trunk leads to large drops in performance while removing recycling or triangular updates leads to smaller degradations. \u003c/p\u003e\n\u003cp\u003e11. When should we trust a prediction, and what does the speed advantage cost?\u003c/p\u003e\n\u003cp\u003eESMFold provides 3 confidence signals: pLDDT (expectde local structure accuracy, reported per residue), pTM (expected agreement of the overall structure with true structure), and ESM-2 perplexity (how predictable the amino-acid sequence was). Authors use pseudo-perplexity, masking each position separately, which requires L language-model forward passes for a sequence of length L. Overall ESMFold is faster than AlphaFold2 (speedups can reach 60 times for short sequences and about 6 times for a 384 residue long sequence), but that comes at the cost of lower average accuracy, especially on different targets. \u003c/p\u003e\n\u003cp\u003e12. What has the metagenomic atlas actually established?\u003c/p\u003e\n\u003cp\u003eThe trained system is applied to predict the protein structures of metogenomic sequences from MGnify. These are 617M protein sequences for which ESM is applied to predict the structures (although the ground-truth experimental data is not present for most of them). Out of these, 225M are generated with high confidence (high confidence means both plDDT and pTM scores exceed 0.7), however again that is not experimentally verified. Authors also examine 1M high-confidence predictions and find that 76.8% have less than 90% sequence identity to nearest UniRrf90 match, that demonstrates considerable sequence diversity, however that does not establish that these proteins fold or function. Authors also compare selected predictions with AlphaFold2 and find substantial agreement, but this doesn\u0026#x27;t replace experimental validation (also this is not independent evidence as a lot of data to train ESMFold was distilled from AlphaFold2). The predicted set of structures can act as hypothesis for biologists to test for specific functions, but its cannot ascertain any biological role.\u003c/p\u003e", "summary_text": "1. What is a protein, and what does its “structure” mean?\n\nA protein is a sequence of amino-acids (now called as residues). Its structure is the 3-D coordinates of the atoms. Note that proteins can occur in multiple conformations. \n\n2. Why does knowing a protein’s structure matter?\n\nA protein's structure suggests its biological role, although the function <script>
'use strict';
const {groups,papers}=JSON.parse(document.getElementById('library-data').textContent);
const byId=new Map(papers.map(p=>[p.id,p]));
const byGroup=new Map(groups.map(g=>[g.id,g]));
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const colorStyle=g=>{
 const rgb=g.rgb.split(',').map(Number),light=rgb.map(c=>Math.round(c*.94)),dark=rgb.map(c=>Math.round(c+(255-c)*.45));
 return `--group-color-light:rgb(${light});--group-rgb-light:${g.rgb};--group-color-dark:rgb(${dark});--group-rgb-dark:${dark}`;
};
$('theme-picker').value=window.libraryTheme.preference;
$('theme-picker').addEventListener('change',event=>window.libraryTheme.set(event.target.value));
let activeGroup='all',activePaper=null,trail=[],origin=null;
const tags=[...new Set(papers.flatMap(p=>p.tags))].sort();
const subcategories=[...new Set(papers.map(p=>p.subcategory).filter(Boolean))].sort();
$('all-count').textContent=papers.length;
$('group-nav').innerHTML=groups.map((g,i)=>`<button class="nav-item" data-group="${esc(g.id)}" style="${colorStyle(g)}" aria-pressed="false"><span class="dot"></span><span class="nav-label">${esc(g.name)}</span><span class="count">${papers.filter(p=>p.group===g.id).length}</span></button>`).join('');
$('mobile-group').innerHTML='<option value="all">All groups</option>'+groups.map(g=>`<option value="${esc(g.id)}">${esc(g.name)}</option>`).join('');
$('tag-filter').insertAdjacentHTML('beforeend',tags.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join(''));
$('subcategory-filter').insertAdjacentHTML('beforeend',subcategories.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join(''));
$('subcategory-filter').hidden=!subcategories.length;
function render(){
 const query=$('search').value.trim().toLocaleLowerCase(),tag=$('tag-filter').value,sub=$('subcategory-filter').value;
 const visible=papers.filter(p=>(activeGroup==='all'||p.group===activeGroup)&&(tag==='all'||p.tags.includes(tag))&&(sub==='all'||p.subcategory===sub)&&(!query||[p.id,p.title,p.label,p.year,p.publication_type,byGroup.get(p.group).name,p.subcategory,...p.tags,p.summary_text].join(' ').toLocaleLowerCase().includes(query)));
 document.querySelectorAll('[data-group]').forEach(el=>{const selected=el.dataset.group===activeGroup;el.classList.toggle('active',selected);el.setAttribute('aria-pressed',String(selected));});
 $('mobile-group').value=activeGroup;
 $('view-title').textContent=activeGroup==='all'?'The collection':byGroup.get(activeGroup).name;
 $('results').textContent=`${visible.length} of ${papers.length} papers`;
 $('reset').hidden=activeGroup==='all'&&tag==='all'&&sub==='all'&&!query;
 let previous=null;
 $('paper-rows').innerHTML=visible.map(p=>{
  const g=byGroup.get(p.group),start=previous!==null&&previous!==p.group;previous=p.group;
  return `<tr id="row-${p.id}" class="${start?'group-start ':''}${activePaper===p.id?'selected':''}" style="${colorStyle(g)}"><td><div class="group-label"><span class="dot"></span><span>${esc(g.name)}</span></div>${p.subcategory?`<span class="subcategory">${esc(p.subcategory)}</span>`:''}</td><td><button class="paper-id" data-paper="${p.id}" aria-label="Open ${p.id}: ${esc(p.label)}">${p.id}</button></td><td><a class="paper-title" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">${esc(p.title)} <span class="external" aria-hidden="true">↗</span></a><div class="paper-meta"><span class="model-label">${esc(p.label)}</span><span>·</span><span>${p.year}</span><span>·</span><span>${esc(p.publication_type)}</span></div></td><td><div class="tag-list">${p.tags.map(t=>`<button class="tag ${tag===t?'active':''}" data-tag="${esc(t)}" aria-label="Filter by ${esc(t)}">${esc(t)}</button>`).join('')}</div></td><td>${p.summary_text?`<button class="summary-button" data-paper="${p.id}" aria-label="Read your summary of ${p.id}">View summary</button>`:'<span class="empty-summary" aria-label="No summary written">—</span>'}</td><td><div class="relations">${p.related.map(r=>`<a class="related-id" href="#${r.id}" data-paper="${r.id}" title="${esc(byId.get(r.id).label+': '+r.relationship)}" aria-label="Open related paper ${r.id}: ${esc(byId.get(r.id).label)}">${r.id}</a>`).join('')||'<span class="empty-summary">—</span>'}</div></td></tr>`;
 }).join('');
 $('empty-state').hidden=visible.length!==0;
}
function reset(){activeGroup='all';$('search').value='';$('tag-filter').value='all';$('subcategory-filter').value='all';render();}
function openPaper(id,remember=true){
 const p=byId.get(id);if(!p)return;
 const dialog=$('paper-dialog'),g=byGroup.get(p.group);
 if(!dialog.open){origin=document.activeElement;trail=[];}else if(remember&&activePaper&&activePaper!==id){trail.push(activePaper);}
 activePaper=id;
 $('detail-id').textContent=id+' / PAPER NOTES';
 $('detail-id').hidden=trail.length>0;
 $('detail-back').hidden=!trail.length;
 $('detail-back').textContent=trail.length?'← Back to '+trail[trail.length-1]:'';
 $('detail-body').style.cssText=colorStyle(g);
 $('detail-body').innerHTML=`<div class="detail-category"><span class="dot"></span>${esc(g.name)}${p.subcategory?' / '+esc(p.subcategory):''}</div><h2 class="detail-title" id="detail-title" tabindex="-1">${esc(p.title)}</h2><div class="detail-meta">${p.id} · ${p.year} · ${esc(p.publication_type)} &nbsp; <a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">Open publication ↗</a>${(p.additional_urls||[]).map(l=>`<br><a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.label)} ↗</a>`).join('')}</div><div class="tag-list detail-tags">${p.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><section class="detail-section"><h3>My summary</h3>${p.summary_text?`<div class="summary-content">${p.summary_html}</div>`:'<div class="summary-empty">Your summary will appear here.</div>'}</section><section class="detail-section"><h3>Related papers${p.related.length?' · '+p.related.length:''}</h3><div class="connection-list">${p.related.map(r=>{const target=byId.get(r.id);return `<a class="connection" href="#${r.id}" data-paper="${r.id}"><span>${r.id} ↗</span><div><strong>${esc(target.label)}</strong><small>${esc(r.relationship)}</small></div></a>`;}).join('')||'<p>No connections added yet.</p>'}</div></section>`;
 history.replaceState(null,'','#'+id);
 if(!dialog.open)dialog.showModal();
 dialog.scrollTop=0;$('detail-title').focus();
 document.querySelectorAll('#paper-rows tr').forEach(row=>row.classList.toggle('selected',row.id==='row-'+id));
}
document.addEventListener('click',event=>{
 const paper=event.target.closest('[data-paper]');if(paper){event.preventDefault();openPaper(paper.dataset.paper);return;}
 const group=event.target.closest('[data-group]');if(group){activeGroup=group.dataset.group;render();return;}
 const tag=event.target.closest('[data-tag]');if(tag){$('tag-filter').value=tag.dataset.tag;render();return;}
 if(event.target.closest('[data-reset]'))reset();
});
$('search').addEventListener('input',render);
$('tag-filter').addEventListener('change',render);
$('subcategory-filter').addEventListener('change',render);
$('mobile-group').addEventListener('change',event=>{activeGroup=event.target.value;render();});
$('reset').addEventListener('click',reset);
$('close-dialog').addEventListener('click',()=>$('paper-dialog').close());
$('detail-back').addEventListener('click',()=>{const id=trail.pop();if(id)openPaper(id,false);});
$('paper-dialog').addEventListener('click',event=>{if(event.target===$('paper-dialog')){const r=event.target.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)event.target.close();}});
$('paper-dialog').addEventListener('close',()=>{activePaper=null;trail=[];history.replaceState(null,'',location.pathname+location.search);document.querySelectorAll('#paper-rows tr.selected').forEach(row=>row.classList.remove('selected'));if(origin&&origin.isConnected)origin.focus();});
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(byId.has(id))openPaper(id);else if($('paper-dialog').open)$('paper-dialog').close();});
render();
if(byId.has(location.hash.slice(1)))openPaper(location.hash.slice(1));
</script>
</body>
</html>
